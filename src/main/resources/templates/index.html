<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Internal Go Links Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="mb-8 flex items-center justify-between border-b pb-4">
      <div>
        <h1 class="text-3xl font-bold text-indigo-600 flex items-center gap-2">🚀 Internal Go Links</h1>
        <p class="text-gray-500 text-sm mt-1">Short, memorable links for internal team tools & documents.</p>
      </div>
      <span class="inline-block bg-indigo-100 text-indigo-800 text-xs px-2.5 py-1 rounded-full font-mono">go/</span>
    </header>

    <!-- Create Form -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Create or Update a Shortcut</h2>
      <form id="shortcut-form" class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Shortcut Name</label>
          <div class="flex items-center">
            <span class="bg-gray-100 border border-r-0 border-gray-300 text-gray-500 px-3 py-2 rounded-l-md text-sm font-mono">go/</span>
            <input type="text" id="keyword" required placeholder="design-system" class="w-full border border-gray-300 rounded-r-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 font-mono">
          </div>
        </div>
        <div class="md:col-span-5">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Target URL</label>
          <input type="url" id="targetUrl" required placeholder="https://figma.com/file/..." class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Description</label>
          <input type="text" id="description" placeholder="Optional notes" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="md:col-span-2 flex items-end">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md transition text-sm">Save Link</button>
        </div>
      </form>
    </div>

    <!-- Active Table -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b border-gray-100 flex items-center justify-between">
        <h2 class="text-lg font-semibold text-gray-900">Active Shortcuts</h2>
        <input type="text" id="search" placeholder="Search links..." class="border border-gray-300 rounded-md px-3 py-1.5 text-sm w-64">
      </div>
      <table class="w-full text-left text-sm border-collapse">
        <thead>
          <tr class="bg-gray-50 text-gray-500 border-b border-gray-200 uppercase text-xs">
            <th class="py-3 px-4">Shortcut</th>
            <th class="py-3 px-4">Target Destination</th>
            <th class="py-3 px-4">Description</th>
            <th class="py-3 px-4 text-center">Clicks</th>
            <th class="py-3 px-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="shortcuts-table-body" class="divide-y divide-gray-100"></tbody>
      </table>
    </div>
  </div>

  <script>
    let allShortcuts = [];
    async function fetchShortcuts() {
      const res = await fetch('/api/shortcuts');
      allShortcuts = await res.json();
      renderShortcuts(allShortcuts);
    }

    function renderShortcuts(shortcuts) {
      const tbody = document.getElementById('shortcuts-table-body');
      tbody.innerHTML = shortcuts.length === 0 ? '<tr><td colspan="5" class="text-center py-6 text-gray-400">No shortcuts found.</td></tr>' : '';
      shortcuts.forEach(s => {
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="py-3 px-4 font-mono font-medium text-indigo-600"><a href="/${s.keyword}" target="_blank" class="hover:underline">go/${s.keyword}</a></td>
            <td class="py-3 px-4 text-gray-600 truncate max-w-xs"><a href="${s.targetUrl}" target="_blank" class="hover:text-gray-900">${s.targetUrl}</a></td>
            <td class="py-3 px-4 text-gray-500">${s.description || '-'}</td>
            <td class="py-3 px-4 text-center font-mono text-gray-700">${s.clicks}</td>
            <td class="py-3 px-4 text-right"><button onclick="deleteShortcut('${s.keyword}')" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button></td>
          </tr>`;
      });
    }

    document.getElementById('shortcut-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/shortcuts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          keyword: document.getElementById('keyword').value,
          targetUrl: document.getElementById('targetUrl').value,
          description: document.getElementById('description').value
        })
      });
      document.getElementById('shortcut-form').reset();
      fetchShortcuts();
    });

    async function deleteShortcut(keyword) {
      if (confirm(`Delete go/${keyword}?`)) {
        await fetch(`/api/shortcuts/${keyword}`, { method: 'DELETE' });
        fetchShortcuts();
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderShortcuts(allShortcuts.filter(s => s.keyword.includes(q) || s.targetUrl.toLowerCase().includes(q)));
    });

    fetchShortcuts();
  </script>
</body>
</html>
